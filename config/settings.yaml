# ClanGloryBot - Configuration
# ME Server Optimized

bot:
  name: "ClanGloryBot"
  version: "2.0.0"
  debug: false
  max_workers: 1
  request_timeout: 45

server:
  target_region: "ME"
  region_name: "MENA"
  game_version: "OB54"
  client_version: "1.126.2"
  client_version_code: "2024010012"
  user_agent: "Dalvik/2.1.0 (Linux; U; Android 11; SM-A145F Build/RP1A.200720.012)"

encryption:
  # PRIMARY KEYS - Extracted from OB54 client
  main_key: "Yg&tc%DEuh6%Zc^8"
  main_iv: "6oyZDr22E3ychjM%"
  key_rotation: false
  fallback_keys: []

rate_limiting:
  requests_per_second: 8
  burst_size: 15
  guest_cooldown_seconds: 5

matchmaking:
  spam_duration: 18
  spam_delay: 0.2
  match_wait: 60
  leave_delay: 2.0
  cycle_delay: 3.0
  reconnect_delay: 3
  packet_interval: 0.5
  keepalive_interval: 2.0
  max_ready_packets_per_spam: 300

guests:
  file: "data/guests.json"
  batch_size: 100
  health_check_interval: 3600
  auto_remove_dead: true
  max_age_days: 30

jwt:
  cache_enabled: true
  ttl_hours: 20
  refresh_before_expiry_minutes: 60

logging:
  level: "INFO"
  file: "data/bot.log"
  max_size_mb: 50
  backup_count: 5
  format: "%(asctime)s | %(levelname)-8s | [%(name)s] %(message)s"
